<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hayatta Kalma Yanılgısı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=EB+Garamond:ital,wght@0,500;0,600;1,500&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F4EEDD;
    --ink: #111111;
    --pencil: #555555;
    --red: #D64045;
    --serif: "EB Garamond", Georgia, "Times New Roman", serif;
    --type: "Special Elite", "Courier New", Courier, monospace;
    --hand: "Architects Daughter", "Comic Sans MS", cursive;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #1c1a16;
  }
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1080px; height: 1920px;
    transform-origin: 0 0;
    background: var(--paper);
    overflow: hidden;
    box-shadow: 0 0 80px rgba(0,0,0,.5);
  }
  #stage svg { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  #cap {
    position: absolute; left: 90px; width: 900px; top: 1470px;
    font-family: var(--type); font-size: 47px; line-height: 1.38;
    color: var(--ink); text-align: center;
    letter-spacing: .5px;
  }
  #cap .r { color: var(--red); }
  #cap .caret { color: var(--red); }
  #replay {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    z-index: 10;
    font-family: var(--serif); font-size: 17px; font-weight: 600;
    letter-spacing: .5px;
    color: var(--ink); background: var(--paper);
    border: 1.5px solid var(--ink); border-radius: 999px;
    padding: 8px 20px; cursor: pointer;
    box-shadow: 2px 3px 0 rgba(0,0,0,.35);
  }
  #replay:hover { background: #fff8e6; }
  #replay:active { transform: translateX(-50%) translateY(2px); box-shadow: 1px 1px 0 rgba(0,0,0,.35); }
  body.capture #replay { display: none; }
  body.capture #stage { box-shadow: none; }

  .ink   { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .thin  { stroke-width: 1.8; }
  .pen   { fill: none; stroke: var(--pencil); stroke-width: 1.8; stroke-linecap: round; }
  .dash  { stroke-dasharray: 10 8; }
  .redl  { fill: none; stroke: var(--red); stroke-width: 5; stroke-linecap: round; }
  .hand  { font-family: var(--hand); fill: var(--pencil); }
  .type  { font-family: var(--type); fill: var(--ink); }
  .serif { font-family: var(--serif); fill: var(--ink); }
</style>
</head>

<script>
(() => {
  const DUR = 35;
  const $ = (id) => document.getElementById(id);
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const eo = (x) => 1 - Math.pow(1 - x, 3);
  const back = (x) => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2);
  const lerp = (a, b, u) => a + (b - a) * u;
  const win = (t, a, b, f = 0.4) => eio(seg(t, a, a + f)) * (1 - eio(seg(t, b - f, b)));
  const params = new URLSearchParams(location.search);
  if (params.has("capture")) document.body.classList.add("capture");

  // ---------- sahneyi ekrana sığdır (9:16)
  const stage = $("stage");
  function fit() {
    const s = Math.min(innerWidth / 1080, innerHeight / 1920);
    stage.style.transform = `scale(${s}) translate(-50%, -50%)`;
    stage.style.transformOrigin = "0 0";
  }
  addEventListener("resize", fit);
  fit();

  // ---------- çizilen (stroke-dasharray) öğeler
  const draws = [...document.querySelectorAll("[data-d]")].map((el) => {
    const [s, d] = el.dataset.d.split(",").map(Number);
    const da = getComputedStyle(el).strokeDasharray;
    const keepDash = da && da !== "none";
    if (!keepDash) el.setAttribute("pathLength", "1");
    return { el, s, d, keepDash };
  });
  function applyDraws(t) {
    for (const o of draws) {
      const p = eio(seg(t, o.s, o.s + o.d));
      if (o.keepDash) {
        // kesikli çizgiler: çizim yerine maske gibi opaklıkla gelir
        o.el.style.opacity = p;
        continue;
      }
      o.el.style.strokeDasharray = "1 1";
      o.el.style.strokeDashoffset = 1 - p;
      o.el.style.opacity = p > 0.001 ? 1 : 0;
    }
  }

  // ---------- ilerleme göstergesi
  const STAGES = [[0, 7, "KANCA"], [7, 16, "HATA"], [16, 26, "AYDINLANMA"], [26, 999, "DERS"]];
  const NUMS = ["I", "II", "III", "IV"];
  const numG = $("numerals");
  const NS = "http://www.w3.org/2000/svg";
  const numEls = NUMS.map((n, i) => {
    const x = 540 + (i - 1.5) * 170;
    const tx = document.createElementNS(NS, "text");
    tx.setAttribute("x", x); tx.setAttribute("y", 16);
    tx.textContent = n;
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", 0); c.setAttribute("r", 36);
    c.setAttribute("fill", "none"); c.setAttribute("stroke", "#D64045");
    c.setAttribute("stroke-width", "3"); c.setAttribute("pathLength", "1");
    c.setAttribute("transform", `rotate(-100 ${x} 0)`);
    numG.append(c, tx);
    return { tx, c };
  });
  function applyProgress(t) {
    let cur = 0;
    STAGES.forEach((s, i) => { if (t >= s[0]) cur = i; });
    numEls.forEach(({ tx, c }, i) => {
      tx.setAttribute("fill", i < cur ? "#111" : i === cur ? "#D64045" : "#555");
      tx.setAttribute("fill-opacity", i <= cur ? 1 : 0.35);
      const p = i === cur ? eio(seg(t, STAGES[i][0] + 0.05, STAGES[i][0] + 0.7)) : 0;
      c.style.strokeDasharray = "1 1";
      c.style.strokeDashoffset = 1 - p;
      c.style.opacity = p > 0 ? 1 : 0;
    });
    const nm = $("stageName");
    nm.textContent = STAGES[cur][2];
    nm.setAttribute("opacity", eo(seg(t, STAGES[cur][0], STAGES[cur][0] + 0.5)));
  }

  // ---------- kurşun delikleri
  function rng(seed) {
    return () => {
      seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
      let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }
  const R = rng(1943);
  const le = (x) => 700 + (490 - x) * (82 / 372); // sol kanat hücum kenarı
  const zones = [];
  const add = (n, fx, fy) => { for (let i = 0; i < n; i++) { const x = fx(); zones.push([x, fy(x)]); } };
  for (const side of [1, -1]) {
    const m = (x) => (side === 1 ? x : 1080 - x);
    add(8, () => m(lerp(130, 228, R())), (x) => lerp(le(side === 1 ? x : 1080 - x) + 12, 826, R()));
    add(4, () => m(lerp(296, 346, R())), (x) => lerp(le(side === 1 ? x : 1080 - x) + 12, 835, R()));
    add(5, () => m(lerp(414, 478, R())), (x) => lerp(le(side === 1 ? x : 1080 - x) + 12, 840, R()));
    add(5, () => m(lerp(382, 522, R())), () => lerp(1172, 1206, R()));
  }
  add(16, () => lerp(500, 580, R()), () => {
    let y; do { y = lerp(690, 1110, R()); } while (Math.abs(y - 935) < 26);
    return y;
  });
  const holesG = $("holes");
  const holes = zones.map(([x, y], i) => {
    const g = document.createElementNS(NS, "g");
    const r = lerp(5, 8.5, R());
    const ring = document.createElementNS(NS, "circle");
    ring.setAttribute("r", r + 4); ring.setAttribute("fill", "none");
    ring.setAttribute("stroke", "#111"); ring.setAttribute("stroke-width", "1.4");
    ring.setAttribute("stroke-dasharray", `${lerp(4, 9, R())} ${lerp(3, 6, R())}`);
    ring.setAttribute("opacity", ".55");
    const dot = document.createElementNS(NS, "circle");
    dot.setAttribute("r", r); dot.setAttribute("fill", "#D64045");
    g.append(ring, dot);
    holesG.append(g);
    return { g, dot, ring, x, y, t0: 3.5 + R() * 3.0 };
  });
  function applyHoles(t) {
    const fade = eio(seg(t, 17.0, 18.4)) * (1 - eio(seg(t, 26.2, 27.2)) * 0.85);
    for (const h of holes) {
      const p = seg(t, h.t0, h.t0 + 0.28);
      const s = p <= 0 ? 0 : back(p);
      h.g.setAttribute("transform", `translate(${h.x} ${h.y}) scale(${s})`);
      h.dot.setAttribute("fill-opacity", lerp(1, 0.12, fade));
      h.ring.setAttribute("opacity", lerp(0.55, 0.3, fade));
    }
  }

  // ---------- altyazı (daktilo)
  const CAPS = [
    [0.3, 6.9, "Üsse dönen uçakların hep **aynı yerlerinde** kurşun delikleri vardı."],
    [7.2, 15.8, "Ordu, **en çok vurulan yerleri** güçlendirmek istedi."],
    [16.2, 20.4, "Ama matematikçi **Abraham Wald** onları durdurdu:"],
    [20.5, 25.9, "“Siz sadece **geri dönebilen** uçaklara bakıyorsunuz.”"],
    [26.2, 29.4, "Buna **Hayatta Kalma Yanılgısı** denir."],
    [29.5, 33.2, "Sadece kazananların hikâyesini dinlersen, **kaybedenlerin düştüğü tuzağı** göremezsin."],
    [33.3, 1e9, "**Kaydet.**"],
  ].map(([a, b, s]) => {
    const chars = [];
    let red = false;
    for (let i = 0; i < s.length; i++) {
      if (s[i] === "*" && s[i + 1] === "*") { red = !red; i++; continue; }
      chars.push([s[i], red]);
    }
    return { a, b, chars };
  });
  const capEl = $("cap");
  let capKey = "";
  const esc = (c) => (c === "<" ? "&lt;" : c === "&" ? "&amp;" : c);
  function applyCaption(t) {
    const c = CAPS.find((c) => t >= c.a && t < c.b);
    if (!c) { if (capKey) { capEl.innerHTML = ""; capKey = ""; } return; }
    const n = Math.min(c.chars.length, Math.floor((t - c.a) * 34));
    const caretOn = n < c.chars.length || (t * 2) % 1 < 0.55;
    const op = 1 - eio(seg(t, c.b - 0.25, c.b));
    const key = `${c.a}|${n}|${caretOn}|${op.toFixed(2)}`;
    if (key === capKey) return;
    capKey = key;
    let html = "", red = false;
    for (let i = 0; i < n; i++) {
      const [ch, r] = c.chars[i];
      if (r !== red) { html += r ? '<span class="r">' : "</span>"; red = r; }
      html += esc(ch);
    }
    if (red) html += "</span>";
    if (caretOn) html += '<span class="caret">▍</span>';
    capEl.innerHTML = html;
    capEl.style.opacity = op;
  }

  // ---------- kare
  const op = (id, v) => $(id).setAttribute("opacity", clamp(v));
  function render(t) {
    applyDraws(t);
    applyProgress(t);
    applyHoles(t);
    applyCaption(t);

    // başlık notu (daktilo)
    const tn = "PLAN GÖRÜNÜŞ · AĞIR BOMBARDIMAN UÇAĞI · 1943";
    $("tn1").textContent = tn.slice(0, Math.floor(seg(t, 0.4, 2.0) * tn.length));
    op("titleNote", 1 - eio(seg(t, 6.6, 7.1)));
    op("dims", eio(seg(t, 2.3, 2.8)) * (1 - eio(seg(t, 6.6, 7.2))));

    // II: zırh
    const armorIn = eo(seg(t, 7.4, 7.8));
    const blink = t > 9 && t < 16 ? 0.55 + 0.45 * (0.5 + 0.5 * Math.cos((t - 9) * 7)) : 1;
    op("armor", armorIn * blink * (1 - eio(seg(t, 17.0, 17.8))));
    op("planNote", win(t, 8.3, 16.0, 0.4));

    // III: Wald
    op("wald", win(t, 16.2, 26.1, 0.45));
    const pulse = t > 19.6 ? 0.78 + 0.22 * Math.sin(t * 5) : 1;
    op("crit", eo(seg(t, 18.3, 18.6)) * pulse * (1 - 0.35 * eio(seg(t, 26.2, 27.2))));
    op("critLabels", 1 - eio(seg(t, 25.8, 26.4)));
    $("critFill").setAttribute("opacity", eo(seg(t, 19.0, 19.6)));
    op("lostNote", win(t, 21.0, 26.1, 0.4));
    const gA = win(t, 22.0, 26.0, 0.5);
    op("ghosts", gA * 0.85);
    op("ghostNote", gA);
    const ft = Math.max(0, t - 22);
    $("g1").setAttribute("transform", `translate(${170 - ft * 6} ${1110 + ft * 38})`);
    $("g1r").setAttribute("transform", `rotate(${-14 - ft * 14})`);
    $("g2").setAttribute("transform", `translate(${910 + ft * 6} ${1125 + ft * 34})`);
    $("g2r").setAttribute("transform", `rotate(${16 + ft * 12})`);

    // IV: küçülme + terazi
    const u = eio(seg(t, 26.0, 27.3));
    const s = 1 - 0.6 * u;
    const cy = 860 - 280 * u;
    $("planeWrap").setAttribute("transform", `translate(540 ${cy}) scale(${s}) translate(-540 -860)`);
    op("scale", eo(seg(t, 27.1, 27.4)));
    let ang = lerp(-7, 13, eio(seg(t, 30.2, 31.8)));
    if (t > 31.8) ang += 2.2 * Math.sin((t - 31.8) * 6) * Math.exp(-(t - 31.8) * 1.6);
    $("beam").setAttribute("transform", `rotate(${ang} 540 900)`);
    const rad = (ang * Math.PI) / 180;
    const L = [540 - 330 * Math.cos(rad), 900 - 330 * Math.sin(rad)];
    const Rr = [540 + 330 * Math.cos(rad), 900 + 330 * Math.sin(rad)];
    for (const [id, p] of [["panL", L], ["panLc", L], ["panR", Rr], ["panRc", Rr]]) {
      $(id).setAttribute("transform", `translate(${p[0]} ${p[1]})`);
    }
    op("winner", eo(seg(t, 28.6, 29.1)));
    op("labL", eo(seg(t, 28.8, 29.3)));
    document.querySelectorAll(".lost").forEach((el, i) => {
      el.setAttribute("opacity", eo(seg(t, 29.6 + i * 0.22, 29.9 + i * 0.22)));
    });
    op("labR", eo(seg(t, 30.2, 30.6)));

    // mühür
    const sp = seg(t, 26.5, 26.85);
    const ss = lerp(1.7, 1, eo(sp));
    op("stamp", sp > 0 ? Math.min(1, sp * 1.4) * 0.92 : 0);
    $("stamp").setAttribute("transform", `translate(540 335) scale(${ss})`);

    // kaydet
    op("save", eo(seg(t, 33.5, 33.7)));
    $("savePath").style.fill = `rgba(214,64,69,${eo(seg(t, 34.1, 34.5))})`;
  }

  // ---------- oynatma
  let start = null, raf = 0;
  const fixed = params.get("t");
  function loop(now) {
    if (start === null) start = now;
    const t = Math.min(DUR, (now - start) / 1000);
    render(t);
    if (t < DUR) raf = requestAnimationFrame(loop);
  }
  function play() {
    cancelAnimationFrame(raf);
    start = null;
    raf = requestAnimationFrame(loop);
  }
  $("replay").addEventListener("click", play);
  window.__render = render; // kare yakalama için

  const ready = Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(),
                              new Promise((r) => setTimeout(r, 1500))]);
  ready.then(() => {
    if (fixed !== null) render(parseFloat(fixed));
    else play();
  });
})();
</script>
</body>
</html>
